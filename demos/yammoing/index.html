<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yammoing - Interactive Demo | Summer Ann Portfolio</title>
  <meta name="description" content="Yammoing: Revolutionary AI-powered health scanning app - Interactive Demo">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
    }

    /* Floating back button */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-5px);
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
    }

    .back-btn i {
      font-size: 12px;
      transition: transform 0.3s ease;
    }

    .back-btn:hover i {
      transform: translateX(-3px);
    }

    /* Portfolio badge */
    .portfolio-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(108, 99, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(108, 99, 255, 0.4);
    }

    .portfolio-badge:hover {
      background: rgba(108, 99, 255, 1);
      transform: scale(1.05);
    }

    /* Full screen iframe */
    .demo-iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Loading state */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(108, 99, 255, 0.2);
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .back-btn {
        top: 10px;
        left: 10px;
        padding: 10px 16px;
        font-size: 13px;
      }

      .portfolio-badge {
        bottom: 10px;
        right: 10px;
        padding: 8px 12px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <!-- Back to Portfolio Button -->
  <a href="/" class="back-btn">
    <i class="fas fa-arrow-left"></i>
    Back to Portfolio
  </a>

  <!-- Portfolio Badge -->
  <a href="/" class="portfolio-badge">
    <i class="fas fa-briefcase"></i>
    Summer Ann Portfolio
  </a>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading Interactive Demo...</p>
  </div>

  <!-- Full Interactive Demo -->
  <iframe
    src="/demos/yammoing-full/index.html"
    class="demo-iframe"
    id="demo-frame"
    title="Yammoing Interactive Demo"
    allow="autoplay; fullscreen"
  ></iframe>

  <script>
    // Hide loading overlay when iframe loads
    const iframe = document.getElementById('demo-frame');
    const loading = document.getElementById('loading');

    iframe.addEventListener('load', function() {
      setTimeout(() => {
        loading.classList.add('hidden');
      }, 500);
    });

    // Fallback - hide loading after 5 seconds
    setTimeout(() => {
      loading.classList.add('hidden');
    }, 5000);
  </script>
</body>
</html>
