<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevSecCode Scanner | Desktop App Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=SF+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-window: #1e1e1e;
      --bg-sidebar: #252526;
      --bg-editor: #1e1e1e;
      --bg-panel: #252526;
      --bg-hover: #2a2d2e;
      --bg-active: #37373d;
      --border: #3c3c3c;
      --text: #cccccc;
      --text-muted: #858585;
      --accent: #0078d4;
      --success: #4ec9b0;
      --warning: #dcdcaa;
      --danger: #f14c4c;
      --info: #9cdcfe;
      --purple: #c586c0;
      --orange: #ce9178;
      --titlebar-bg: #323233;
      --titlebar-text: #cccccc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
      background: #0a0a0a;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Back Button */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: all 0.2s ease;
      z-index: 1000;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }

    /* Desktop Window Frame */
    .desktop-window {
      width: 100%;
      max-width: 1200px;
      height: 700px;
      background: var(--bg-window);
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.1),
        0 25px 80px rgba(0,0,0,0.6),
        0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }

    /* macOS Style Title Bar */
    .titlebar {
      height: 38px;
      background: var(--titlebar-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      -webkit-app-region: drag;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .traffic-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    .traffic-light.close { background: #ff5f57; }
    .traffic-light.minimize { background: #febc2e; }
    .traffic-light.maximize { background: #28c840; }

    .titlebar-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--titlebar-text);
    }

    .titlebar-spacer {
      width: 52px;
    }

    /* Main Content */
    .app-content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .scan-btn {
      width: 100%;
      padding: 10px 16px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .scan-btn:hover {
      filter: brightness(1.1);
    }

    .scan-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-item:hover {
      background: var(--bg-hover);
    }

    .nav-item.active {
      background: var(--bg-active);
    }

    .nav-item i {
      width: 16px;
      color: var(--text-muted);
    }

    .nav-item .badge {
      margin-left: auto;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-danger { background: rgba(241,76,76,0.2); color: var(--danger); }
    .badge-warning { background: rgba(220,220,170,0.2); color: var(--warning); }
    .badge-info { background: rgba(156,220,254,0.2); color: var(--info); }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Main Panel */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Toolbar */
    .toolbar {
      height: 40px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .toolbar-title {
      font-size: 13px;
      font-weight: 500;
    }

    .toolbar-spacer {
      flex: 1;
    }

    .toolbar-btn {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .toolbar-btn:hover {
      background: var(--bg-hover);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Finding Cards */
    .finding-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(10px);
      animation: slideIn 0.3s ease forwards;
    }

    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .finding-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .finding-header:hover {
      background: var(--bg-hover);
    }

    .severity-badge {
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .severity-high { background: rgba(241,76,76,0.2); color: var(--danger); }
    .severity-medium { background: rgba(220,220,170,0.2); color: var(--warning); }
    .severity-low { background: rgba(78,201,176,0.2); color: var(--success); }

    .finding-title {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
    }

    .finding-cwe {
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      color: var(--purple);
    }

    .finding-chevron {
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }

    .finding-card.expanded .finding-chevron {
      transform: rotate(90deg);
    }

    .finding-body {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px solid var(--border);
    }

    .finding-card.expanded .finding-body {
      display: block;
    }

    .finding-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 12px 0;
    }

    .finding-location {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-editor);
      border-radius: 4px;
      font-family: 'SF Mono', monospace;
      font-size: 12px;
      color: var(--info);
      margin-bottom: 12px;
    }

    /* Code Block */
    .code-block {
      background: var(--bg-editor);
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }

    .code-header {
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    .code-content {
      padding: 12px;
      font-family: 'SF Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      overflow-x: auto;
    }

    .code-line {
      display: flex;
    }

    .line-number {
      width: 35px;
      color: var(--text-muted);
      text-align: right;
      padding-right: 12px;
      user-select: none;
    }

    .line-removed { background: rgba(241,76,76,0.1); }
    .line-added { background: rgba(78,201,176,0.1); }

    .code-keyword { color: var(--purple); }
    .code-string { color: var(--orange); }
    .code-function { color: var(--warning); }
    .code-comment { color: #6a9955; }

    /* Status Bar */
    .statusbar {
      height: 24px;
      background: var(--accent);
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 11px;
      color: white;
      gap: 16px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-state h3 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text);
    }

    .empty-state p {
      font-size: 13px;
    }

    /* Progress Bar */
    .scan-progress {
      display: none;
      margin-top: 12px;
    }

    .scan-progress.active {
      display: block;
    }

    .progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Demo Label */
    .demo-label {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 8px 16px;
      background: rgba(0,120,212,0.2);
      border: 1px solid rgba(0,120,212,0.4);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      z-index: 1000;
    }
  </style>
</head>
<body>
  <a href="/" class="back-btn">
    <i class="fas fa-arrow-left"></i>
    Back to Portfolio
  </a>

  <div class="demo-label">
    <i class="fas fa-desktop"></i> Tauri Desktop Demo
  </div>

  <div class="desktop-window">
    <!-- Title Bar -->
    <div class="titlebar">
      <div class="traffic-lights">
        <div class="traffic-light close"></div>
        <div class="traffic-light minimize"></div>
        <div class="traffic-light maximize"></div>
      </div>
      <div class="titlebar-title">DevSecCode Scanner</div>
      <div class="titlebar-spacer"></div>
    </div>

    <!-- Main Content -->
    <div class="app-content">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <h2>Scanner</h2>
          <button class="scan-btn" id="scanBtn" onclick="runScan()">
            <i class="fas fa-play"></i>
            Start Scan
          </button>
          <div class="scan-progress" id="scanProgress">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Initializing...</div>
          </div>
        </div>

        <nav class="sidebar-nav">
          <div class="nav-item active" data-view="findings">
            <i class="fas fa-bug"></i>
            <span>Findings</span>
            <span class="badge badge-danger" id="findingsCount">0</span>
          </div>
          <div class="nav-item" data-view="files">
            <i class="fas fa-file-code"></i>
            <span>Files</span>
            <span class="badge badge-info" id="filesCount">0</span>
          </div>
          <div class="nav-item" data-view="rules">
            <i class="fas fa-list-check"></i>
            <span>Rules</span>
          </div>
          <div class="nav-item" data-view="settings">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div>DevSecCode v1.0.0</div>
          <div style="margin-top: 4px;">5 detectors active</div>
        </div>
      </div>

      <!-- Main Panel -->
      <div class="main-panel">
        <div class="toolbar">
          <span class="toolbar-title">Security Findings</span>
          <div class="toolbar-spacer"></div>
          <button class="toolbar-btn">
            <i class="fas fa-filter"></i>
            Filter
          </button>
          <button class="toolbar-btn">
            <i class="fas fa-download"></i>
            Export
          </button>
        </div>

        <div class="content-area" id="contentArea">
          <div class="empty-state" id="emptyState">
            <i class="fas fa-shield-alt"></i>
            <h3>No scan results yet</h3>
            <p>Click "Start Scan" to analyze your code for vulnerabilities</p>
          </div>
          <div id="findingsContainer"></div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="statusbar">
      <div class="status-item">
        <i class="fas fa-folder"></i>
        <span id="statusPath">~/projects/my-app</span>
      </div>
      <div class="status-item">
        <i class="fas fa-code-branch"></i>
        <span>main</span>
      </div>
      <div style="flex: 1;"></div>
      <div class="status-item" id="statusScan">
        <i class="fas fa-check-circle"></i>
        <span>Ready</span>
      </div>
    </div>
  </div>

  <script>
    const findings = [
      {
        id: 'CWE-208',
        title: 'Timing Attack in Password Verification',
        severity: 'high',
        desc: 'Using string comparison (==) for password verification allows timing attacks. An attacker can measure response times to guess the password character by character.',
        file: 'auth/login.py',
        line: 47,
        codeBefore: `def verify_password(stored, provided):
    return stored == provided  # Vulnerable`,
        codeAfter: `import hmac
def verify_password(stored, provided):
    return hmac.compare_digest(stored, provided)`
      },
      {
        id: 'CWE-521',
        title: 'Weak Password Requirements',
        severity: 'high',
        desc: 'Password validation only checks minimum length of 6 characters. No requirements for uppercase, numbers, or special characters.',
        file: 'auth/register.py',
        line: 23,
        codeBefore: `def validate_password(password):
    return len(password) >= 6`,
        codeAfter: `import re
def validate_password(password):
    return (len(password) >= 12 and
            re.search(r'[A-Z]', password) and
            re.search(r'[0-9]', password))`
      },
      {
        id: 'CWE-639',
        title: 'Insecure Direct Object Reference',
        severity: 'high',
        desc: 'User ID from URL parameter used directly in database query without authorization check.',
        file: 'api/users.py',
        line: 89,
        codeBefore: `@app.get("/user/{user_id}")
def get_user(user_id: int):
    return db.query(User).get(user_id)`,
        codeAfter: `@app.get("/user/{user_id}")
def get_user(user_id: int, current = Depends(get_current)):
    if user_id != current.id:
        raise HTTPException(403)`
      },
      {
        id: 'CWE-532',
        title: 'PHI/Sensitive Data in Logs',
        severity: 'medium',
        desc: 'Logging patient health information (PHI) in plaintext violates HIPAA compliance.',
        file: 'services/patient.py',
        line: 156,
        codeBefore: `logger.info(f"Patient {patient.ssn}: {patient.diagnosis}")`,
        codeAfter: `logger.info(f"Patient {hash(patient.id)} record updated")`
      },
      {
        id: 'CWE-669',
        title: 'Exposed Endpoint Without Rate Limiting',
        severity: 'medium',
        desc: 'Public API endpoint has no rate limiting. Vulnerable to brute force and DoS attacks.',
        file: 'api/auth.py',
        line: 34,
        codeBefore: `@app.post("/login")
def login(credentials: LoginRequest):
    return authenticate(credentials)`,
        codeAfter: `@limiter.limit("5/minute")
@app.post("/login")
def login(credentials: LoginRequest):
    return authenticate(credentials)`
      }
    ];

    const scanSteps = [
      'Initializing scanner...',
      'Loading detectors...',
      'Parsing Python files...',
      'Running CWE-208 detector...',
      'Running CWE-521 detector...',
      'Running CWE-639 detector...',
      'Running CWE-532 detector...',
      'Running CWE-669 detector...',
      'Analyzing results...',
      'Scan complete!'
    ];

    let isScanning = false;

    function runScan() {
      if (isScanning) return;
      isScanning = true;

      const scanBtn = document.getElementById('scanBtn');
      const scanProgress = document.getElementById('scanProgress');
      const progressFill = document.getElementById('progressFill');
      const progressText = document.getElementById('progressText');
      const emptyState = document.getElementById('emptyState');
      const findingsContainer = document.getElementById('findingsContainer');
      const statusScan = document.getElementById('statusScan');

      scanBtn.disabled = true;
      scanBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning...';
      scanProgress.classList.add('active');
      emptyState.style.display = 'none';
      findingsContainer.innerHTML = '';
      statusScan.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Scanning...';

      let step = 0;
      const interval = setInterval(() => {
        if (step < scanSteps.length) {
          const progress = ((step + 1) / scanSteps.length) * 100;
          progressFill.style.width = progress + '%';
          progressText.textContent = scanSteps[step];
          step++;
        } else {
          clearInterval(interval);
          finishScan();
        }
      }, 400);
    }

    function finishScan() {
      const scanBtn = document.getElementById('scanBtn');
      const scanProgress = document.getElementById('scanProgress');
      const findingsContainer = document.getElementById('findingsContainer');
      const findingsCount = document.getElementById('findingsCount');
      const filesCount = document.getElementById('filesCount');
      const statusScan = document.getElementById('statusScan');

      scanBtn.disabled = false;
      scanBtn.innerHTML = '<i class="fas fa-play"></i> Start Scan';
      scanProgress.classList.remove('active');
      statusScan.innerHTML = '<i class="fas fa-check-circle"></i> 5 findings';

      findingsCount.textContent = findings.length;
      filesCount.textContent = '23';

      findings.forEach((finding, i) => {
        setTimeout(() => {
          findingsContainer.appendChild(createFindingCard(finding, i));
        }, i * 100);
      });

      isScanning = false;
    }

    function createFindingCard(finding, index) {
      const card = document.createElement('div');
      card.className = 'finding-card';
      card.style.animationDelay = `${index * 0.1}s`;

      const severityClass = finding.severity === 'high' ? 'severity-high' :
                           finding.severity === 'medium' ? 'severity-medium' : 'severity-low';

      card.innerHTML = `
        <div class="finding-header" onclick="toggleFinding(this)">
          <span class="severity-badge ${severityClass}">${finding.severity}</span>
          <span class="finding-title">${finding.title}</span>
          <span class="finding-cwe">${finding.id}</span>
          <i class="fas fa-chevron-right finding-chevron"></i>
        </div>
        <div class="finding-body">
          <p class="finding-desc">${finding.desc}</p>
          <div class="finding-location">
            <i class="fas fa-file-code"></i>
            ${finding.file}:${finding.line}
          </div>
          <div class="code-block">
            <div class="code-header">
              <span><i class="fas fa-minus-circle" style="color: var(--danger);"></i> Vulnerable Code</span>
            </div>
            <div class="code-content">
              ${formatCode(finding.codeBefore, 'removed')}
            </div>
          </div>
          <div class="code-block">
            <div class="code-header">
              <span><i class="fas fa-plus-circle" style="color: var(--success);"></i> Suggested Fix</span>
            </div>
            <div class="code-content">
              ${formatCode(finding.codeAfter, 'added')}
            </div>
          </div>
        </div>
      `;
      return card;
    }

    function toggleFinding(header) {
      const card = header.parentElement;
      card.classList.toggle('expanded');
    }

    function formatCode(code, type) {
      const lines = code.split('\n');
      return lines.map((line, i) => {
        const lineClass = type === 'removed' ? 'line-removed' : 'line-added';
        const highlighted = highlightSyntax(line);
        return `<div class="code-line ${lineClass}">
          <span class="line-number">${i + 1}</span>
          <span>${highlighted}</span>
        </div>`;
      }).join('');
    }

    function highlightSyntax(line) {
      return line
        .replace(/(def |return |import |from |if |and |or |raise )/g, '<span class="code-keyword">$1</span>')
        .replace(/(".*?"|'.*?')/g, '<span class="code-string">$1</span>')
        .replace(/(#.*$)/g, '<span class="code-comment">$1</span>')
        .replace(/(\w+)\(/g, '<span class="code-function">$1</span>(');
    }

    // Nav item clicks
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
