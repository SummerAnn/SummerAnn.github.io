<!-- CRITICAL: Image path fix v2.0 - must load BEFORE React to intercept broken image requests -->

  'use strict';

  // Fix any image path - handles all broken patterns

    if (!path || typeof path !== 'string') return path;

    let fixed = path;

    // Fix myProfile - any variant
    if (path.toLowerCase().includes('myprofile')) {
      // Remove any double slashes, extra 'images/' prefixes
      fixed = '/images/myProfile.jpg';
      return fixed;
    }

    // Fix double /images/ or images// patterns
    if (path.includes('//images/') || path.includes('/images//') || path.includes('images//')) {

    const pMatch = path.match(/^\/?p(\d+)\.jpg$/i);
    if (pMatch) {
      fixed = '/images/portfolio/App/p' + pMatch[1] + '.jpg';
    }

    // Fix images/ without leading slash
    if (fixed.match(/^images\//)) {
      fixed = '/' + fixed;
    }

    return fixed;
  }
